  <script>
    (function(){
      const timeline = gsap.timeline({paused:true});
      window.__timelines = window.__timelines || {};
      window.__timelines['01-explainer'] = timeline;
      const el = name => document.getElementById('pool-' + name);
      const hideAtBuild = ['blue','green','black','plan','shared-card','shared-title','close-state','save','pv','general','allocation','tank-top','liquid-rule','liquid-sheen','members-label','tray-a','tray-b','tray-c','schematic','personal'];
      timeline.set(hideAtBuild.map(el),{opacity:0},0);
      timeline.set(el('liquid'),{scaleY:0},0);
      timeline.set(['a','b','c'].map(s=>el('tray-flow-'+s)),{scaleX:0},0);
      timeline.set(el('close-state'),{scale:.7},0);
      timeline.set(['not','so','fast'].map(el),{opacity:0,x:35},0);

      // A single content-length reduction places the three hook beats.
      const hookContent = [
        {title:'44%',hold:.75},
        {title:'YOU?',hold:1.32},
        {title:'NOT SO FAST',hold:1.2}
      ];
      let hookCursor=.12;
      const hookSequence=hookContent.map(entry=>{
        const start=hookCursor;
        hookCursor+=.6+entry.title.length*.04+entry.hold;
        return {...entry,start,end:hookCursor};
      });
      timeline.fromTo(el('context'),{y:-20,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},.06);
      timeline.fromTo(el('vessel'),{rotation:-6,scale:.92,y:18,opacity:0},{rotation:-3,scale:1,y:0,opacity:1,duration:.54,ease:'power3.out'},hookSequence[0].start);
      timeline.fromTo(el('stripe-main'),{rotation:2,y:45,opacity:0},{rotation:6,y:0,opacity:1,duration:.58,ease:'power3.out'},.22);
      timeline.fromTo(el('stripe-corner'),{rotation:-8,y:-40,opacity:0},{rotation:9,y:0,opacity:1,duration:.7,ease:'power3.out'},.45);
      timeline.fromTo(el('you'),{rotation:14,scale:.68,opacity:0},{rotation:8,scale:1,opacity:1,duration:.42,ease:'power3.out'},hookSequence[1].start);
      timeline.fromTo(el('stop'),{rotation:-9,scale:1.18,opacity:0,y:20},{rotation:-6,scale:1,opacity:1,y:0,duration:.32,ease:'power4.out'},hookSequence[2].start);
      let wordOffset=0;
      ['not','so','fast'].forEach(word=>{
        timeline.to(el(word),{x:0,opacity:1,duration:.24,ease:'power4.out'},hookSequence[2].start+wordOffset);
        wordOffset+=.1+word.length*.03;
      });
      // Matching upward acceleration and deceleration retain the ticket as the actor.
      timeline.to([el('you'),el('stop')],{y:-65,opacity:0,duration:.3,ease:'power4.in'},4.408);
      timeline.to(el('vessel'),{y:-32,rotation:0,duration:.3,ease:'power4.in'},4.408);
      timeline.to(el('vessel'),{y:-64,duration:.3,ease:'power4.out'},4.708);
      timeline.to(el('vessel'),{y:0,duration:.45,ease:'power3.out'},5.008);
      timeline.to(el('blue'),{opacity:1,duration:.42,ease:'power1.out'},4.708);
      timeline.to(el('stripe-main'),{rotation:3,y:30,opacity:.22,duration:.6,ease:'power3.out'},4.708);
      timeline.to([el('ticket-label'),el('ticket-teeth')],{opacity:0,duration:.22,ease:'power1.out'},4.708);
      timeline.fromTo(el('pv'),{y:35,opacity:0},{y:0,opacity:1,duration:.48,ease:'power4.out'},5.22);
      timeline.fromTo(el('tank-top'),{y:-12,opacity:0},{y:0,opacity:1,duration:.4,ease:'power3.out'},5.65);
      timeline.to(el('stat'),{scale:.56,y:60,duration:.85,ease:'power3.inOut'},6.3);
      // The complete tank is total sales PV. Only its lower 44% fills.
      timeline.fromTo(el('liquid'),{scaleY:0},{scaleY:.44,duration:1.1,ease:'power2.out'},6.95);
      timeline.fromTo(el('liquid-rule'),{opacity:0},{opacity:1,duration:.2,ease:'power1.out'},7.98);
      timeline.fromTo(el('liquid-sheen'),{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:.42,ease:'power3.out'},8.05);
      timeline.fromTo(el('general'),{y:40,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},8.3);
      timeline.fromTo(el('allocation'),{y:35,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out'},9.55);

      // Pull the reservoir upward to make room for three schematic outlets.
      timeline.to(el('green'),{opacity:1,duration:.4,ease:'power1.out'},11.037);
      timeline.to(el('vessel'),{y:-75,scale:.86,duration:.32,ease:'power4.in'},10.717);
      timeline.to(el('vessel'),{y:-150,scale:.72,duration:.32,ease:'power4.out'},11.037);
      timeline.to(el('pv'),{y:-110,scale:.9,duration:.64,ease:'power3.inOut'},10.717);
      timeline.to(el('general'),{y:-590,scale:.55,duration:.64,ease:'power3.inOut'},10.717);
      timeline.to(el('allocation'),{y:-60,opacity:0,duration:.32,ease:'power4.in'},10.717);
      timeline.to(el('stripe-main'),{y:290,rotation:-3,opacity:.18,duration:.64,ease:'power3.inOut'},10.717);
      timeline.fromTo(el('members-label'),{y:30,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},11.48);
      const measuredPaths=['pipe-a','pipe-b','pipe-c','water-a','water-b','water-c','cross-line'];
      measuredPaths.forEach(name=>{
        const path=el(name),length=path.getTotalLength();
        path.style.strokeDasharray=String(length);
        path.style.strokeDashoffset=String(length);
      });
      ['a','b','c'].forEach((suffix,index)=>{
        const start=11.77+index*.56;
        timeline.fromTo(el('tray-'+suffix),{x:60,rotation:index%2?-2:2,opacity:0},{x:0,rotation:0,opacity:1,duration:.45,ease:'power4.out'},start+.36);
        timeline.to(el('pipe-'+suffix),{strokeDashoffset:0,duration:.8,ease:'power2.out'},start);
        timeline.to(el('water-'+suffix),{strokeDashoffset:0,duration:.8,ease:'power2.out'},start+.08);
        timeline.to(el('tray-flow-'+suffix),{scaleX:1,duration:.45,ease:'power2.out'},start+.77);
      });
      timeline.fromTo(el('schematic'),{y:20,opacity:0},{y:0,opacity:1,duration:.4,ease:'power3.out'},13.72);
      timeline.fromTo(el('personal'),{rotation:5,scale:.8,y:20,opacity:0},{rotation:-3,scale:1,y:0,opacity:1,duration:.42,ease:'power3.out'},14.65);
      timeline.to(el('cross-line'),{strokeDashoffset:0,duration:.55,ease:'power2.out'},16.0);

      // One actor compacts into its own shared-pool card before the final swap.
      timeline.fromTo(el('plan'),{y:35,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},17.687);
      timeline.to([el('pv'),el('general'),el('members-label'),el('schematic'),el('personal')],{opacity:0,duration:.3,ease:'power1.out'},17.687);
