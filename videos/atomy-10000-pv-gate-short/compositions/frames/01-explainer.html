  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="01-explainer"]');
      const el = (id) => root.querySelector('#' + id);
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['01-explainer'] = tl;
      const DURATION = 24.260;
      const widthUnit = 1080 / 100;
      const px = (n) => n * widthUnit;

      // Content-aware sequencing is computed once, then mapped to the measured VO windows.
      function sequence(items, start, end) {
        const raw = items.map(item => ({ ...item, span: 0.60 + item.body.length * 0.045 + item.hold }));
        const total = raw.reduce((sum, item) => sum + item.span, 0);
        let cursor = start;
        return raw.map(item => {
          const span = item.span / total * (end - start);
          const result = { ...item, start: cursor, end: cursor + span };
          cursor += span;
          return result;
        });
      }
      const hookSequence = sequence([
        { body: 'BEFORE THE TEAM', hold: 0.25 },
        { body: 'PERSONAL PV', hold: 0.25 },
        { body: 'GATE', hold: 0.55 }
      ], 0, 4.345);
      const finalSequence = sequence([
        { body: 'GATE OPEN ≠ PAYDAY', hold: 0.50 },
        { body: 'RECHECK LOCAL PLAN', hold: 2.00 },
        { body: 'SAVE', hold: 1.10 }
      ], 16.940, DURATION);

      // Initial states live on the seekable timeline, not in CSS or deferred callbacks.
      tl.set([
        el('gate-heading-two'), el('gate-heading-three'), el('gate-meter'), el('gate-key'),
        el('gate-lock'), el('gate-flow-one'), el('gate-flow-two'), el('gate-lane-payout'),
        el('gate-rules-lock'), el('gate-not-payday'), el('gate-close-card'),
        el('gate-close-open'), el('gate-close-payday'), el('gate-local-plan'), el('gate-save')
      ], { opacity: 0 }, 0);
      tl.set(el('gate-meter-fill'), { scaleX: 0 }, 0);
      tl.set(el('gate-flow-two'), { scale: 0.74 }, 0);

      // Scene 1: the same gate is already readable as a silhouette; key and lock arrive in order.
      tl.fromTo(el('gate-frame'), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.48, ease: 'power3.out' }, 0.02);
      tl.fromTo(el('gate-eyebrow'), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.02);
      ['gate-word-before', 'gate-word-the', 'gate-word-team'].forEach((id, index) => {
        tl.fromTo(el(id), { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.48, ease: 'power3.out' }, hookSequence[0].start + index * 0.22);
      });
      tl.fromTo(el('gate-key'), { opacity: 0, x: -30, y: 10, scale: 0.88 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.68, ease: 'power3.out' }, hookSequence[1].start);
      tl.fromTo(el('gate-lock'), { opacity: 0, scale: 0.82, y: -18 }, { opacity: 1, scale: 1, y: 0, duration: 0.54, ease: 'power3.out' }, hookSequence[2].start);
      tl.to(el('gate-key'), { x: 72, y: -87, scale: 0.65, duration: 0.78, ease: 'power3.inOut' }, hookSequence[2].start + 0.18);

      // Internal headline seams use one velocity-matched Z cut; the diagram never unmounts.
      function headlineCut(outId, inId, at) {
        tl.to(el(outId), { scale: 1.20, filter: 'blur(10px)', duration: 0.20, ease: 'power3.in' }, at - 0.20);
        tl.to(el(outId), { opacity: 0.15, duration: 0.20, ease: 'none' }, at - 0.20);
        tl.set(el(outId), { opacity: 0 }, at);
        tl.fromTo(el(inId), { opacity: 0.15, scale: 0.75, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.50, ease: 'expo.out', immediateRender: false }, at);
      }

      // Scene 2: personal PV resolves first; only then can the downstream track appear.
      headlineCut('gate-heading-one', 'gate-heading-two', 4.345);
      tl.fromTo(el('gate-meter'), { opacity: 0, y: 28, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: 'power3.out' }, 4.58);
      tl.to(el('gate-camera'), { y: -15, duration: 1.0, ease: 'power3.inOut' }, 4.345);
      const counter = { value: 0 };
      let lastValue = -1;
      tl.to(counter, {
        value: 10000, duration: 1.55, ease: 'power2.out',
        onUpdate: () => {
          const value = Math.round(counter.value);
          if (value !== lastValue) {
            el('gate-count').textContent = value.toLocaleString('en-US');
            lastValue = value;
          }
        }
      }, 5.65);
      tl.to(el('gate-meter-fill'), { scaleX: 1, duration: 1.55, ease: 'power2.out' }, 5.65);
      tl.to(el('gate-key'), { x: 145, scale: 0.50, opacity: 0, duration: 0.34, ease: 'power2.in' }, 7.30);
      tl.to(el('gate-lock'), { x: 180, y: 36, opacity: 0, rotation: 8, duration: 0.48, ease: 'power3.inOut' }, 7.34);
      tl.to(el('gate-door-left'), { rotationY: -79, transformPerspective: 900, duration: 0.90, ease: 'power3.inOut' }, 7.72);
      tl.to(el('gate-door-right'), { rotationY: 79, transformPerspective: 900, duration: 0.90, ease: 'power3.inOut' }, 7.72);
      tl.fromTo(el('gate-flow-one'), { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.65, ease: 'power3.out' }, 8.66);

      // Scene 3: same actor, closer framing. Scale-swap separates generation from payout.
      headlineCut('gate-heading-two', 'gate-heading-three', 10.333);
      tl.to(el('gate-camera'), { scale: 1.04, y: -18, duration: 0.90, ease: 'power3.inOut' }, 10.333);
      tl.to(el('gate-flow-one'), { scale: 0.74, opacity: 0, duration: 0.34, ease: 'power2.in' }, 10.333);
      tl.fromTo(el('gate-flow-two'), { scale: 0.74, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.60, ease: 'power3.out', immediateRender: false }, 10.523);
      tl.fromTo(el('gate-proceed-arrow'), { x: -18, opacity: 0 }, { x: 0, opacity: 1, duration: 0.56, ease: 'power3.out' }, 11.05);
      tl.fromTo(el('gate-not-payday'), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 12.10);
      tl.fromTo(el('gate-lane-payout'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.65, ease: 'power3.out' }, 12.36);
      tl.fromTo(el('gate-rules-lock'), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.60, ease: 'power3.out' }, 14.10);

      // Scene 4: pull the open gate into the inverted take-away, preserving both tracks.
      tl.to(el('gate-heading-three'), { scale: 0.80, filter: 'blur(10px)', duration: 0.20, ease: 'power3.in' }, 16.74);
      tl.to(el('gate-heading-three'), { opacity: 0.15, duration: 0.20, ease: 'none' }, 16.74);
      tl.set(el('gate-heading-three'), { opacity: 0 }, 16.940);
      tl.to(el('gate-not-payday'), { opacity: 0, y: -15, duration: 0.30, ease: 'power3.in' }, 16.74);
      tl.fromTo(el('gate-close-card'), { scale: 1.12, opacity: 0.15, filter: 'blur(18px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.65, ease: 'expo.out', immediateRender: false }, finalSequence[0].start);
      tl.to(el('gate-camera'), { scale: 0.66, y: 300, duration: 1.05, ease: 'power3.inOut' }, 16.940);
      tl.fromTo(el('gate-close-open'), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.60, ease: 'power3.out' }, 17.20);
      tl.fromTo(el('gate-close-payday'), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.60, ease: 'power3.out' }, 17.76);
      tl.fromTo(el('gate-local-plan'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.60, ease: 'power3.out' }, finalSequence[1].start);
      tl.fromTo(el('gate-save'), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.48, ease: 'power3.out' }, finalSequence[2].start);
      tl.to(el('gate-save'), { x: px(0.37), y: px(0.37), scale: 0.97, duration: 0.16, ease: 'power2.inOut' }, finalSequence[2].start + 0.56);
      tl.to(el('gate-save'), { x: 0, y: 0, scale: 1, duration: 0.22, ease: 'power3.out' }, finalSequence[2].start + 0.72);
      tl.to({}, { duration: 0.001 }, DURATION - 0.001);
    })();
  </script>
