name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest --cov=daily_video_factory --cov-report=term-missing
      - run: node --test tests/test_production_compositions.mjs tests/test_story_compositions.mjs tests/cinematic_primitives.test.cjs tests/cinematic_build.test.mjs tests/procedural_story_state.test.mjs tests/countdown_story_state.test.mjs
