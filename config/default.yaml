channel:
  name: "Atomy, Explained"
  language: "en"
  region: "US"
  timezone: "Asia/Kolkata"
  brand_name: "Atomy"
  brand_required: true
  content_goal: "Help skeptical beginners evaluate Atomy membership using official sources and no hype."
  audience:
    - passive income
    - online business
    - entrepreneurship
    - work from home
    - side hustle
    - productivity
    - Korean skincare
    - supplements
    - financial freedom
    - business mindset
  disclosure: >-
    This video uses AI-assisted production, including an AI-generated narration voice.
    It is educational and is not financial, medical, or income advice. Results and
    experiences vary. Atomy is discussed as one option, not as a guaranteed outcome.

schedule:
  hour: 7
  minute: 0
  upload_privacy: private
  publish_hour: 18
  catch_up_if_missed: true

research:
  seed_topics:
    - online business for beginners
    - realistic side hustle
    - Korean skincare routine
    - supplement habits
    - productivity for entrepreneurs
    - ethical network marketing
    - financial freedom habits
    - work from home systems
  editorial_topics:
    - "How to join Atomy USA: consumer vs distributor registration"
    - "What an Atomy sponsor does and what to check before registering"
    - "The Atomy compensation plan explained without income hype"
    - "Atomy consumer membership: a practical first-time walkthrough"
    - "How to decide whether Atomy fits your goals, budget, and time"
    - "Questions to ask before joining Atomy as a distributor"
    - "Atomy membership requirements, verification, and common registration mistakes"
    - "How to read Atomy PV and commissions without confusing revenue with profit"
  rotate_editorial_topics: true
  max_official_source_age_days: 90
  official_sources:
    - title: Atomy USA Membership Registration User Guide
      url: https://us.atomy.com/cst/userGuide/24100000001691
      checked_on: 2026-08-12
      summary: >-
        The U.S. guide separates Consumer and Distributor registration. Both flows include
        membership selection, acceptance of terms, U.S. mobile verification, personal
        information, sponsor designation, review, and confirmation. Distributor registration
        additionally requests Social Security and bank information. A sponsor may be selected
        automatically or manually.
    - title: Atomy America Member Agreement
      url: https://us.atomy.com/common/footerTermsInfo?isHtml=Y&tabIndex=1
      checked_on: 2026-08-12
      summary: >-
        The agreement says applicants must be legal U.S. residents who are at least 18,
        apply under their legal name with valid identification, provide accurate information,
        and receive company approval. Members are independent participants rather than company
        employees and are responsible for their own taxes and expenses.
    - title: Atomy USA Compensation Plan
      url: https://us.atomy.com/cst/marketingPlan
      checked_on: 2026-08-12
      summary: >-
        The official plan describes PV-based dealership classes, qualification thresholds,
        general commissions, and mastership bonuses. Qualification and incentive figures are
        conditional and subject to plan rules, sales activity, exchange rates, and change; the
        page does not establish what a typical individual will earn after expenses.
    - title: FTC Business Guidance Concerning Multi-Level Marketing
      url: https://www.ftc.gov/business-guidance/resources/business-guidance-concerning-multi-level-marketing
      checked_on: 2026-08-12
      summary: >-
        FTC staff guidance says earnings and lifestyle claims must be truthful, substantiated,
        and representative of what the intended audience is likely to achieve after typical
        expenses. A generic results-vary disclaimer does not repair a misleading claim, and
        testimonials or limited-hours claims need reliable evidence.
  reddit_subreddits: [Entrepreneur, sidehustle, productivity, SkincareAddiction]
  max_candidates: 40
  request_timeout_seconds: 15

