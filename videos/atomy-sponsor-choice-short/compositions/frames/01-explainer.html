  <script>
    (function () {
      const duration = 24.644;
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="01-explainer"]');
      const targets = (selector) => root.querySelectorAll(selector);
      const one = (selector) => root.querySelector(selector);

      // Content-weighted reveal sequencing is computed once, inside each measured VO window.
      function sequence(entries, start, end) {
        const weights = entries.map((entry) => 0.6 + entry.body.length * 0.04 + entry.hold);
        const weightTotal = weights.reduce((sum, value) => sum + value, 0);
        let cursor = start;
        return entries.map((entry, i) => {
          const span = (end - start) * weights[i] / weightTotal;
          const item = Object.assign({}, entry, { start: cursor, end: cursor + span });
          cursor += span;
          return item;
        });
      }
      const hookWords = sequence([
        { target: '#sponsor-word-no', body: 'NO', hold: 0.05 },
        { target: '#sponsor-word-sponsor', body: 'SPONSOR?', hold: 0.2 }
      ], 0.03, 0.72);
      const signupReveals = sequence([
        { target: '#sponsor-consumer', body: 'CONSUMER', hold: 0.2 },
        { target: '#sponsor-distributor', body: 'DISTRIBUTOR', hold: 1.4 },
        { target: '#sponsor-placement-label', body: 'PLACEMENT', hold: 0.4 },
        { target: '#sponsor-placement-auto', body: 'AUTO', hold: 0.8 }
      ], 11.15, 17.1);

      // Measured SVG geometry, not guessed dash lengths; all connectors end on diagram actors.
      targets('.sponsor-draw, .sponsor-shield-draw').forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });
      function draw(selector, start, span) {
        tl.to(one(selector), { strokeDashoffset: 0, duration: span, ease: 'power2.out' }, start);
      }
      function enter(selector, start, span, extra) {
        tl.fromTo(one(selector), { opacity: 0, y: 24 }, Object.assign({ opacity: 1, y: 0, duration: span, ease: 'power3.out' }, extra || {}), start);
      }
      function titleSeam(outgoing, incoming, seam) {
        const outgoingEl = one(outgoing);
        const incomingEl = one(incoming);
        tl.set(incomingEl, { opacity: 0, x: 180 }, 0);
        tl.to(outgoingEl, { x: -180, duration: 0.3, ease: 'power4.in' }, seam - 0.3);
        tl.to(outgoingEl, { opacity: 0, duration: 0.28, ease: 'power1.in' }, seam - 0.28);
        tl.fromTo(incomingEl, { x: 180, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.3, ease: 'power4.out', immediateRender: false }, seam);
      }

      // Scene 1: the registration ticket is the persistent hero from the first half second.
      tl.fromTo(one('#sponsor-actor'), { opacity: 0, y: 55, scale: 0.96, rotation: -3.2 }, { opacity: 1, y: 0, scale: 1, rotation: -2.1, duration: 0.48, ease: 'power3.out' }, 0);
      enter('#sponsor-eyebrow', 0.08, 0.38);
      hookWords.forEach((item) => enter(item.target, item.start, 0.4));
      tl.fromTo(one('#sponsor-question'), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.35);
      tl.to(one('#sponsor-actor'), { y: -12, rotation: -1.5, duration: 3, ease: 'none' }, 0.6);

      // Scene 2: the same sponsor field unfolds into a vertical selection fork.
      titleSeam('#sponsor-title-hook', '#sponsor-title-selection', 3.855);
      tl.to(one('#sponsor-actor'), { y: -15, rotation: 0.3, duration: 0.52, ease: 'power3.inOut' }, 3.6);
      enter('#sponsor-selection-label', 4.2, 0.45);
      tl.to(one('#sponsor-blank-box'), { scale: 0.74, opacity: 0, duration: 0.4, ease: 'power2.in' }, 6.08);
      tl.to(one('#sponsor-identity-lines'), { opacity: 0, duration: 0.25, ease: 'power1.in' }, 6.08);
      tl.to(one('#sponsor-ticket-foot'), { opacity: 0, duration: 0.28, ease: 'power1.in' }, 6.08);
      enter('#sponsor-required', 6.28, 0.52);
      draw('#sponsor-fork-trunk', 8.02, 0.64);
      enter('#sponsor-automatic', 8.5, 0.48);
      draw('#sponsor-fork-manual', 9.18, 0.53);
      enter('#sponsor-manual', 9.56, 0.5);

      // Scene 3: sponsor selection reconnects to both signup types; placement is its own lane.
      titleSeam('#sponsor-title-selection', '#sponsor-title-signups', 10.589);
