      (() => {

        const scope = document.querySelector('[data-composition-id="01-explainer"]');

        const tl = gsap.timeline({ paused: true });
        const states = ['ticket', 'point', 'ruler', 'receipt', 'reminder', 'closer'];
        tl.set(states.slice(1).map(el), { opacity: 0, scale: 0.74 }, 0);
        tl.set(['hook-big','hook-number','money','cross','ticket-foot','point-band','measure-label','volume','plan','source','points-row','cash-row','withdraw-label','withdraw-arrow','barrier','commissions','key','read','the','label','label-underline','save','payday-title','final-volume','final-promise'].map(el), { opacity: 0 }, 0);

        // Content-aware sequences are reduced once; measured scene windows stay fixed.
        function sequence(entries, start, end) {
          const BASE_DURATION = 0.6, SEC_PER_CHAR = 0.035;
          const weights = entries.map(entry => BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold);
          const ratio = (end - start) / weights.reduce((sum, value) => sum + value, 0);
          let cumulative = start;
          return entries.map((entry, index) => {
            const duration = weights[index] * ratio;
            const item = { ...entry, start: cumulative, end: cumulative + duration };
            cumulative = item.end;
            return item;
          });
        }
        function reveal(name, at, vars = {}) {
          tl.fromTo(el(name), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out', immediateRender: false, ...vars }, at);
        }
        function swap(outgoing, incoming, at, angle = 0) {
          tl.to(el(outgoing), { scale: 0.74, opacity: 0, duration: 0.36, ease: 'power2.in' }, at);
          tl.fromTo(el(incoming), { scale: 0.74, opacity: 0, rotation: angle }, { scale: 1, opacity: 1, rotation: angle, duration: 0.6, ease: 'back.out(1.4)', immediateRender: false }, at + 0.2);
        }

        // Scene 1 · one ticket; the currency sticker is the mistaken attachment.
        tl.fromTo(el('ticket'), { opacity: 0, scale: 0.9, y: 30, rotation: -0.7 }, { opacity: 1, scale: 1, y: 0, rotation: -0.7, duration: 0.48, ease: 'power3.out' }, 0);
        const hook = sequence([
          { name: 'hook-big', body: 'BIG', hold: 0.2 },
          { name: 'hook-number', body: 'NUMBER?', hold: 0.35 }
        ], 0.22, 1.35);
        hook.forEach(item => reveal(item.name, item.start, { duration: 0.3 }));
        tl.fromTo(el('money'), { opacity: 0, x: 36, y: -44, rotation: 11, scale: 0.78 }, { opacity: 1, x: 0, y: 0, rotation: 5, scale: 1, duration: 0.5, ease: 'back.out(1.4)', immediateRender: false }, 1.66);
        tl.fromTo(el('cross'), { opacity: 0, scale: 1.22, rotation: -5 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.2, ease: 'power3.out', immediateRender: false }, 2.46);
        reveal('ticket-foot', 2.55, { duration: 0.3 });

        // Scene 2 · the ticket defines PV, then unrolls as a measuring surface.
        swap('ticket', 'point', 3.364, -0.7);
        reveal('point-band', 4.27, { duration: 0.36 });

        tl.fromTo(el('ruler'), { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.34, ease: 'power4.out', immediateRender: false }, 5.47);

        reveal('measure-label', 6.69, { duration: 0.44 });
        reveal('volume', 7.68, { duration: 0.42 });
        reveal('plan', 8.76, { duration: 0.48 });
        reveal('source', 9.43, { duration: 0.38 });

        tl.to(el('ruler'), { y: -48, opacity: 0, duration: 0.34, ease: 'power4.in' }, 10.207);
        tl.set(el('receipt'), { scale: 1, rotation: -0.8 }, 10.207);
        tl.fromTo(el('receipt'), { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.34, ease: 'power4.out', immediateRender: false }, 10.547);
        const receiptSequence = sequence([
          { name: 'points-row', body: 'POINTS', hold: 0.35 },

        receiptSequence.forEach(item => reveal(item.name, item.start, { duration: item.name === 'key' ? 0.48 : 0.36 }));
        const withdrawalAt = receiptSequence[2].start;
        tl.fromTo(el('barrier'), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.22, ease: 'power3.out', immediateRender: false }, withdrawalAt);
        tl.fromTo(el('withdraw-arrow'), { opacity: 0, y: -36 }, { opacity: 1, y: 0, duration: 0.46, ease: 'power3.out', immediateRender: false }, withdrawalAt + 0.13);
        tl.to(el('withdraw-arrow'), { y: -9, duration: 0.12, ease: 'power2.out' }, withdrawalAt + 0.59);
        reveal('commissions', receiptSequence[3].start - 0.25, { duration: 0.28 });

        // Scene 4 · a yellow reminder contracts into the held, inverted takeaway.
        swap('receipt', 'reminder', 16.321, -0.7);
        const reminderWords = sequence([
          { name: 'read', body: 'READ', hold: 0.2 },
          { name: 'the', body: 'THE', hold: 0.2 },
          { name: 'label', body: 'LABEL', hold: 0.25 }
        ], 17.15, 18.1);
        reminderWords.forEach(item => reveal(item.name, item.start, { duration: 0.24 }));
        tl.fromTo(el('label-underline'), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, 17.89);
        swap('reminder', 'closer', 18.2, 0.6);
        tl.fromTo(el('save'), { opacity: 0, y: -26, rotation: -4, scale: 0.88 }, { opacity: 1, y: 0, rotation: -4, scale: 1, duration: 0.36, ease: 'back.out(1.4)', immediateRender: false }, 19.02);
        reveal('payday-title', 19.12, { duration: 0.44 });
        reveal('final-volume', 20.13, { duration: 0.4 });
        reveal('final-promise', 21.29, { duration: 0.4 });

        const CONTENT = [
          { title: 'THE LABEL', start: 0, end: 3.364 },
          { title: 'DEFINITION', start: 3.364, end: 10.547 },
          { title: 'THE CAVEAT', start: 10.547, end: 16.321 },
          { title: 'REMEMBER', start: 16.321, end: DURATION }
        ];
        const TIMELINE = CONTENT.map(entry => ({ ...entry }));
        const driver = { t: 0 };
        let lastTitle = '';
        tl.to(driver, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: () => {
          let active = TIMELINE[0];
          for (let i = TIMELINE.length - 1; i >= 0; i--) {
            if (driver.t >= TIMELINE[i].start) { active = TIMELINE[i]; break; }
          }
          if (active.title !== lastTitle) {
            el('status').textContent = active.title;
            lastTitle = active.title;
          }
        } }, 0);

        window.__timelines['01-explainer'] = tl;
      })();
