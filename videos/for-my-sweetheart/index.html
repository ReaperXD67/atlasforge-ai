  <script>
    window.__hf.buildReady.sweetheart.then(() => {
      const filmClock = {time: 0};
      const tl = gsap.timeline({paused: true});
      tl.to(filmClock, {time: 372.76, duration: 372.76, ease: 'none', onUpdate: () => window.renderSweetheartAt(filmClock.time)}, 0);
      document.querySelectorAll('.motion-window').forEach(wrapper => {
        const video = wrapper.querySelector('video');
        const start = Number(video.dataset.start), duration = Number(video.dataset.duration);
        tl.fromTo(wrapper, {opacity: 0}, {opacity: 1, duration: .8, ease: 'sine.inOut'}, start);
        tl.to(wrapper, {opacity: 0, duration: .8, ease: 'sine.inOut'}, start + duration - .8);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines['sweetheart'] = tl;
    });
  </script>
