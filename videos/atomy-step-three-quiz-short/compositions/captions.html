<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face { font-family: 'Inter'; src: url('assets/fonts/Inter-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('assets/fonts/Inter-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
      :root {
      --black: #000000;
      --white: #FFFFFF;
      --offwhite: #FFFDF5;
      --pink: #FE90E8;
      --blue: #C0F7FE;
      --green: #99E885;
      --yellow: #F7CB46;
      --cream: #FFDC8B;
      --cap-ink: #000000;
      --cap-canvas: #FFFFFF;
      --cap-accent: #F7CB46;
      --cap-accent-2: #FFDC8B;
      --font-display: "Inter", system-ui, serif;
      --font-body: "Inter", system-ui, sans-serif;
      --cap-band-top: 1600px;
      --cap-band-height: 320px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE bordered card — 4px black border + 8px hard offset shadow (solid black,
     zero blur, bottom-right — blockframe's sacred depth), square corners */
  .caption-pill {
    max-width: 80%;
    padding: 18px 40px 22px;
    background: var(--cap-canvas, #ffffff);
    border: 4px solid var(--cap-ink, #000000);
    border-radius: 0;
    box-shadow: 8px 8px 0 var(--cap-ink, #000000);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.32em;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(38px, 4.2vw, 56px);
    line-height: 1.12;
    letter-spacing: -0.02em;
  }

  /* upcoming — faded black ink, no stamp */
  .caption-word {
    display: inline-block;
    padding: 0 0.1em;
    color: color-mix(in srgb, var(--cap-ink, #000000) 40%, var(--cap-canvas, #ffffff));
  }
  /* current word — THE yellow stamp-block (box-shadow spread = a hard square block
     w/o layout shift; no blur), black ink reading on top — blockframe's signature stamp */
  .caption-word.is-active {
    color: var(--cap-ink, #000000);
    background: var(--cap-accent, #f7cb46);
    box-shadow: 0 0 0 0.08em var(--cap-accent, #f7cb46);
  }
  /* already spoken — solid black ink, stamp cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #000000);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — heavier ink weight, blockframe's display is already 900 */
  .caption-word.cap-brand {
    color: var(--cap-ink, #000000);
  }
  /* numerals / data — the body voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Inter", ui-monospace, monospace;
    color: color-mix(in srgb, var(--cap-ink, #000000) 74%, var(--cap-canvas, #ffffff));
  }
  /* emphasis — a cream hard underline bar (the second-chroma accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 4px;
    text-decoration-color: var(--cap-accent-2, #ffdc8b);
    text-underline-offset: 0.12em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="7.467"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.04,"end":0.629,"text":"Quick quiz.","words":[{"id":"caption-word-0-0","text":"Quick","start":0.04,"end":0.316},{"id":"caption-word-0-1","text":"quiz.","start":0.346,"end":0.599}]},{"id":"caption-group-1","frame":1,"start":0.629,"end":1.241,"text":"Which Atomy","words":[{"id":"caption-word-1-0","text":"Which","start":0.629,"end":0.905},{"id":"caption-word-1-1","text":"Atomy","start":0.935,"end":1.211}]},{"id":"caption-group-2","frame":1,"start":1.241,"end":1.871,"text":"Evening Care","words":[{"id":"caption-word-2-0","text":"Evening","start":1.241,"end":1.559},{"id":"caption-word-2-1","text":"Care","start":1.589,"end":1.841}]},{"id":"caption-group-3","frame":1,"start":1.871,"end":2.46,"text":"step comes","words":[{"id":"caption-word-3-0","text":"step","start":1.871,"end":2.124},{"id":"caption-word-3-1","text":"comes","start":2.154,"end":2.43}]},{"id":"caption-group-4","frame":1,"start":2.46,"end":2.856,"text":"third?","words":[{"id":"caption-word-4-0","text":"third?","start":2.46,"end":2.736}]},{"id":"caption-group-5","frame":2,"start":2.856,"end":3.369,"text":"Three...","words":[{"id":"caption-word-5-0","text":"Three...","start":2.856,"end":3.339}]},{"id":"caption-group-6","frame":2,"start":3.369,"end":3.793,"text":"two...","words":[{"id":"caption-word-6-0","text":"two...","start":3.369,"end":3.763}]},{"id":"caption-group-7","frame":2,"start":3.793,"end":4.307,"text":"one...","words":[{"id":"caption-word-7-0","text":"one...","start":3.793,"end":4.187}]},{"id":"caption-group-8","frame":3,"start":4.307,"end":4.919,"text":"Peeling Gel.","words":[{"id":"caption-word-8-0","text":"Peeling","start":4.307,"end":4.63},{"id":"caption-word-8-1","text":"Gel.","start":4.66,"end":4.889}]},{"id":"caption-group-9","frame":3,"start":4.919,"end":5.437,"text":"Did you","words":[{"id":"caption-word-9-0","text":"Did","start":4.919,"end":5.148},{"id":"caption-word-9-1","text":"you","start":5.178,"end":5.407}]},{"id":"caption-group-10","frame":3,"start":5.437,"end":5.922,"text":"get it","words":[{"id":"caption-word-10-0","text":"get","start":5.437,"end":5.665},{"id":"caption-word-10-1","text":"it","start":5.695,"end":5.892}]},{"id":"caption-group-11","frame":3,"start":5.922,"end":6.232,"text":"right?","words":[{"id":"caption-word-11-0","text":"right?","start":5.922,"end":6.202}]},{"id":"caption-group-12","frame":3,"start":6.232,"end":6.805,"text":"Save this","words":[{"id":"caption-word-12-0","text":"Save","start":6.232,"end":6.489},{"id":"caption-word-12-1","text":"this","start":6.519,"end":6.775}]},{"id":"caption-group-13","frame":3,"start":6.805,"end":7.507,"text":"for tonight.","words":[{"id":"caption-word-13-0","text":"for","start":6.805,"end":7.034},{"id":"caption-word-13-1","text":"tonight.","start":7.064,"end":7.387}]}];
  var DURATION = 7.467;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.86 }, { scale: 1, duration: 0.2, ease: "back.out(2.4)" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
