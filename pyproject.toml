[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlasforge-ai"
version = "0.2.0"
description = "AtlasForge AI: local-first, policy-aware daily YouTube production automation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "AtlasForge AI contributors" }]
keywords = ["youtube", "automation", "ffmpeg", "ai-video", "tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=10.4,<13",
  "portalocker>=3,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "rich>=13.9,<15",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.70,<3"]
google = ["google-genai>=1.20,<2"]
youtube = [
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
]
local-tts = ["kokoro>=0.9,<1", "soundfile>=0.12,<1"]
transcription = ["faster-whisper>=1.1,<2"]
visual-ranking = ["torch>=2.4,<3", "transformers>=4.46,<6"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]
all = [
  "openai>=1.70,<3",
  "google-genai>=1.20,<2",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "faster-whisper>=1.1,<2",
]

[project.scripts]
atlasforge = "daily_video_factory.cli:app"
# Backward-compatible alias for existing scheduled tasks and installations.
dailyvideo = "daily_video_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_video_factory"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
markers = ["integration: real local media-tool integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/daily_video_factory/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
