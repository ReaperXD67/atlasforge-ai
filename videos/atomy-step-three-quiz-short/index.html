    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-quiz", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 2.816);
        tl.fromTo("#el-02-countdown", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 2.816);
        tl.addLabel("hf:transition:01-quiz:02-countdown:push-slide", 2.816);
        tl.to("#el-02-countdown", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.267);
        tl.fromTo("#el-03-reveal", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4.267);
        tl.addLabel("hf:transition:02-countdown:03-reveal:zoom-through", 4.267);
        tl.to({}, { duration: 7.467 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
